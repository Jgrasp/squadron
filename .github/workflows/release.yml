name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'push' && 'release' || format('test-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event_name == 'pull_request' || startsWith(github.event.head_commit.message, 'Squadron ')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        if: runner.os == 'Linux'
        timeout-minutes: 15
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.9.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec svelte-check --tsconfig ./tsconfig.app.json
      - run: pnpm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          GIT_AUTHOR_NAME: Squadron CI
          GIT_AUTHOR_EMAIL: ci@squadron.invalid
          GIT_COMMITTER_NAME: Squadron CI
          GIT_COMMITTER_EMAIL: ci@squadron.invalid

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - id: create
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=${MESSAGE%%$'\n'*}
          tag=v${version#Squadron }
          id=$(gh api repos/$GITHUB_REPOSITORY/releases -q ".[] | select(.tag_name == \"$tag\") | .id" | head -1)
          [ -n "$id" ] || id=$(gh api repos/$GITHUB_REPOSITORY/releases -f tag_name=$tag -f target_commitish=$GITHUB_SHA -f name="Squadron $tag" -f body="$MESSAGE" -F draft=true -q .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: --bundles deb,appimage
            updater: linux-x86_64
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            updater: darwin-aarch64 darwin-x86_64
          - os: windows-latest
            args: --bundles nsis
            updater: windows-x86_64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        if: runner.os == 'Linux'
        timeout-minutes: 15
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.9.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - if: ${{ env.ACT }}
        run: pnpm tauri build ${{ matrix.args }} --no-sign
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        if: ${{ !env.ACT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ needs.release.outputs.tag }}
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }}
          includeUpdaterJson: true
      - name: Offer this build to the updater
        if: ${{ !env.ACT }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          ID: ${{ needs.release.outputs.id }}
          PLATFORMS: ${{ matrix.updater }}
        run: |
          gh release download "$TAG" -p latest.json -O latest.json --clobber
          version=$(jq -r .version latest.json)
          older() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$2" ]; }
          files=()
          for platform in $PLATFORMS; do
            jq -e --arg p "$platform" '.platforms[$p]' latest.json >/dev/null
            offered=$(gh release download updater -p "$platform.json" -O - 2>/dev/null | jq -r .version || true)
            if [ -n "$offered" ] && older "$version" "$offered"; then
              echo "$platform already offers $offered, newer than $version."
              continue
            fi
            cp latest.json "$platform.json"
            files+=("$platform.json")
          done
          gh api -X PATCH repos/$GITHUB_REPOSITORY/releases/$ID -F draft=false -f make_latest=false >/dev/null
          gh release view updater >/dev/null 2>&1 || gh release create updater --prerelease --latest=false --title Updater --notes "Each platform's newest build, read by Squadron's updater." || true
          [ ${#files[@]} -eq 0 ] || gh release upload updater "${files[@]}" --clobber

  publish:
    needs: [release, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          ID: ${{ needs.release.outputs.id }}
        run: |
          latest=$(gh api repos/$GITHUB_REPOSITORY/releases/latest -q .tag_name 2>/dev/null || true)
          make=true
          if [ -n "$latest" ] && [ "$latest" != "$TAG" ] && [ "$(printf '%s\n%s\n' "${TAG#v}" "${latest#v}" | sort -V | tail -n 1)" = "${latest#v}" ]; then
            echo "$latest stays the latest release, newer than $TAG."
            make=false
          fi
          gh api -X PATCH repos/$GITHUB_REPOSITORY/releases/$ID -F draft=false -f make_latest=$make
