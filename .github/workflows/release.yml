name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Squadron ')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - id: create
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version=${MESSAGE%%$'\n'*}
          tag=v${version#Squadron }
          id=$(gh api repos/$GITHUB_REPOSITORY/releases -q ".[] | select(.tag_name == \"$tag\") | .id" | head -1)
          [ -n "$id" ] || id=$(gh api repos/$GITHUB_REPOSITORY/releases -f tag_name=$tag -f target_commitish=$GITHUB_SHA -f name="Squadron $tag" -f body="$MESSAGE" -F draft=true -q .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: --bundles deb,appimage
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99ci
          sudo apt-get update
          for i in 1 2 3; do
            sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf && break
            [ "$i" = 3 ] && exit 1
            sleep 15
          done
      - uses: pnpm/action-setup@v6
        with:
          version: 12.9.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - if: ${{ env.ACT }}
        run: pnpm tauri build ${{ matrix.args }} --no-sign
      - uses: tauri-apps/tauri-action@v0
        if: ${{ !env.ACT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ needs.release.outputs.tag }}
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }}
          includeUpdaterJson: true

  publish:
    needs: [release, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH repos/$GITHUB_REPOSITORY/releases/${{ needs.release.outputs.id }} -F draft=false -f make_latest=true
