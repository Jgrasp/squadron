[package]
name = "squadron"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "squadron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.4", features = [] }
tauri-plugin-log = "2"
